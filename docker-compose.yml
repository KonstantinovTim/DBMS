services:
  redis-master:
    image: redis:7
    container_name: redis-master
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis.conf:/etc/redis/redis.conf
      - master-data:/data
    ports:
      - "6379:6379"
    networks:
      - redis-net

  redis-replica-1:
    image: redis:7
    container_name: redis-replica-1
    command: redis-server /etc/redis/redis.conf --replicaof redis-master 6379 --replica-read-only yes
    volumes:
      - ./redis.conf:/etc/redis/redis.conf
      - replica-1-data:/data
    ports:
      - "6380:6379"
    networks:
      - redis-net

  redis-replica-2:
    image: redis:7
    container_name: redis-replica-2
    command: redis-server /etc/redis/redis.conf --replicaof redis-master 6379 --replica-read-only yes
    volumes:
      - ./redis.conf:/etc/redis/redis.conf
      - replica-2-data:/data
    ports:
      - "6381:6379"
    networks:
      - redis-net

  sentinel-1:
    image: redis:7
    container_name: sentinel-1
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel1.conf:/etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    networks:
      - redis-net

  sentinel-2:
    image: redis:7
    container_name: sentinel-2
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel2.conf:/etc/redis/sentinel.conf
    ports:
      - "26380:26379"
    networks:
      - redis-net

  sentinel-3:
    image: redis:7
    container_name: sentinel-3
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel3.conf:/etc/redis/sentinel.conf
    ports:
      - "26381:26379"
    networks:
      - redis-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    volumes:
      - insight-data:/data
    depends_on:
      - redis-master
    networks:
      - redis-net

  app:
    build: ./app
    container_name: gamehub-app
    ports:
      - "8080:8080"
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
    networks:
      - redis-net

volumes:
    master-data:
    replica-1-data:
    replica-2-data:
    insight-data:

networks:
  redis-net:
    driver: bridge
